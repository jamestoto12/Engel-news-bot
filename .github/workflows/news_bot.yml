name: 법무부 출입국 언론대응 뉴스봇

on:
  # 하루 1번, 자기 전(KST 21시 이후) 전송
  # GitHub 예약 실행은 실제로 2~9시간 늦게 시작되는 경우가 많아 저녁에 여러 번 걸어 둠.
  # main.py가 21시 이전 실행은 건너뛰고, 21시 이후 처음 실행된 1건만 전송함.
  # 정각(:00)은 GitHub 부하가 몰려 지연이 더 크므로 분을 어긋나게 설정.
  schedule:
    # KST 17:17 = UTC 08:17
    - cron: '17 8 * * *'
    # KST 19:17 = UTC 10:17
    - cron: '17 10 * * *'
    # KST 21:07 = UTC 12:07
    - cron: '7 12 * * *'
    # KST 22:07 = UTC 13:07
    - cron: '7 13 * * *'

  # 수동 실행 (테스트용, 하루 1회 제한 없이 항상 실행)
  workflow_dispatch:

# 예약 실행이 겹쳐 중복 전송되지 않도록 순차 실행
concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run-news-bot:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # sent_history.json 커밋을 위해 필요

    steps:
      - name: 레포지토리 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt

      - name: 뉴스봇 실행
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          python main.py

      - name: 전송 기록 저장 (자동 커밋)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add sent_history.json || true
          git diff --staged --quiet || git commit -m "📰 뉴스봇 실행 기록 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')"
          git push || true
