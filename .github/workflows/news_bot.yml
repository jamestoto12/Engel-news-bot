name: 법무부 출입국 언론대응 뉴스봇

on:
  # 정시 실행: 외부 예약 서비스(cron-job.org)가 매일 KST 22:00에 GitHub API로
  # workflow_dispatch 실행 명령을 보냄. 직접 명령은 예약 대기열을 거치지 않아 보통 1분 안에 시작됨.
  workflow_dispatch:
    inputs:
      force:
        description: '강제 실행 (시간·하루 1회 제한 무시, 테스트용)'
        type: boolean
        default: false

  # 예비 예약: cron-job.org 실행이 빠진 날을 대비. GitHub 예약은 늦게 시작되는 경우가 많아
  # 정시 시각(22:00) 뒤로만 걸어 둠. 그날 이미 보냈으면 main.py가 건너뜀.
  schedule:
    # KST 22:37 = UTC 13:37
    - cron: '37 13 * * *'
    # KST 23:37 = UTC 14:37
    - cron: '37 14 * * *'

# 예약 실행이 겹쳐 중복 전송되지 않도록 순차 실행
concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run-news-bot:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # sent_history.json 커밋을 위해 필요

    steps:
      - name: 레포지토리 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt

      - name: 뉴스봇 실행
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_RUN: ${{ inputs.force && '1' || '0' }}
        run: |
          python main.py

      - name: 전송 기록 저장 (자동 커밋)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add sent_history.json || true
          git diff --staged --quiet || git commit -m "📰 뉴스봇 실행 기록 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')"
          git push || true
